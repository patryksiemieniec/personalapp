services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: personalops
      POSTGRES_USER: personalops
      POSTGRES_PASSWORD: personalops

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personalops -d personalops']
      interval: 5s
      timeout: 3s
      retries: 10

    ports:
      - '5432:5432'

    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: personalops
      DATABASE_PASSWORD: personalops
      DATABASE_NAME: personalops

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - '3001:3001'

    networks:
      - backend
      - frontend

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile

      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - '3000:3000'

    networks:
      - frontend

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    environment:
      NODE_ENV: production

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: personalops
      DATABASE_PASSWORD: personalops
      DATABASE_NAME: personalops

    command: ['node', 'apps/api/dist/database/migrate.js']

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    restart: 'no'
volumes:
  postgres-data:

networks:
  frontend:
  backend:
